name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-A17-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare downloadable APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Luma-A17-v1.1.0-debug.apk
      - name: Publish APK in prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0-debug Luma-A17-v1.1.0-debug.apk --target "${GITHUB_SHA}" --title "Luma A17 1.1.0 (APK teste)" --notes "Compilação Android automática com opções de qualidade e Gemini opcional. APK debug; se houver conflito de assinatura com teste anterior, desinstale o APK antigo antes." --prerelease
