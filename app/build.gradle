plugins { id 'com.android.application' }

android {
    namespace 'com.ib2s.lumaa17'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.ib2s.lumaa17'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '1.4.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('LUMA_KEYSTORE')) {
                storeFile file(System.getenv('LUMA_KEYSTORE'))
                storePassword System.getenv('LUMA_STORE_PASSWORD')
                keyAlias System.getenv('LUMA_KEY_ALIAS') ?: 'luma'
                keyPassword System.getenv('LUMA_KEY_PASSWORD') ?: System.getenv('LUMA_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled true
            shrinkResources true
            if (System.getenv('LUMA_KEYSTORE')) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
    buildFeatures { buildConfig true }
    androidResources { noCompress 'tflite' }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    def cameraVersion = '1.5.3'
    implementation "androidx.camera:camera-camera2:$cameraVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraVersion"
    implementation "androidx.camera:camera-view:$cameraVersion"
    implementation "androidx.camera:camera-video:$cameraVersion"
    implementation "androidx.camera:camera-extensions:$cameraVersion"
    implementation 'com.google.mediapipe:tasks-vision:0.10.29'
    implementation 'androidx.heifwriter:heifwriter:1.1.0'
    implementation 'com.google.ai.edge.litert:litert:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
